name: Publish mono

on:
  push:
    tags:
      - "*@v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve package
        id: pkg
        run: |
          NAME="${GITHUB_REF_NAME%@v*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$NAME" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      # h11-x и h11-x-example резолвят типы h11/h11-x через их package.json
      # ("types" -> dist/types/*.d.ts), а dist в git не лежит — без этого
      # шага tsc для них падает с "Cannot find module 'h11'".
      - name: Собрать h11 (от него зависят типы h11-x и h11-x-example)
        run: bun run build
        working-directory: packages/h11

      - name: Собрать h11-x (от него зависят типы h11-x-example)
        run: bun run build
        working-directory: packages/h11-x

      # --project, а не голый tsc: без него подхватывается корневой
      # tsconfig.json и проверяется весь монорепозиторий, а не только
      # публикуемый пакет.
      - run: bunx tsc --project tsconfig.types.json --noEmit
        working-directory: ${{ steps.pkg.outputs.dir }}

      - run: bun test
        working-directory: ${{ steps.pkg.outputs.dir }}

      - run: bun run build
        working-directory: ${{ steps.pkg.outputs.dir }}

      - run: npm install -g npm@latest

      - run: npm publish
        working-directory: ${{ steps.pkg.outputs.dir }}
