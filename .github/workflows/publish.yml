name: Publish package

# Триггерится тегом вида "<package>@<version>", например "h11@1.2.0" или
# "h11-x@0.1.0". Версия в package.json пакета должна быть уже проставлена
# и закоммичена ДО того, как ставить и пушить тег — сам тег и есть
# ручной сигнал "готово, публикуем", ничего не бампается автоматически.
"on":
  push:
    tags:
      - '*@*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Разобрать тег на имя пакета и версию
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "name=${TAG%@*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"

      - name: Найти директорию пакета
        id: dir
        run: |
          DIR="packages/${{ steps.tag.outputs.name }}"
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::Нет $DIR/package.json (пакет из тега: ${{ steps.tag.outputs.name }})"
            exit 1
          fi
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

      - name: Сверить версию в теге с package.json
        run: |
          PKG_VERSION=$(node -p "require('./${{ steps.dir.outputs.path }}/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Версия в теге (${{ steps.tag.outputs.version }}) не совпадает с ${{ steps.dir.outputs.path }}/package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Установить зависимости
        run: bun install --frozen-lockfile

      - name: Тесты (весь монорепозиторий — пакеты зависят друг от друга)
        run: bun test

      - name: Собрать пакет
        working-directory: ${{ steps.dir.outputs.path }}
        run: bun run build

      - name: Проверить типы
        working-directory: ${{ steps.dir.outputs.path }}
        run: bun run types

      - name: Настроить auth для npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Опубликовать
        working-directory: ${{ steps.dir.outputs.path }}
        run: bun publish
